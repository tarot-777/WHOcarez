name: TRIX CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/add-flake-helpers-20260619
      - trix-os-framework

jobs:
  evaluate:
    name: Evaluate flake and source quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Show flake outputs
        run: nix flake show --all-systems

      - name: Evaluate flake checks without building heavy closures
        run: nix flake check --no-build

      - name: Build TRIX CLI
        run: nix build .#trix

      - name: Build TRIX base shell
        run: nix build .#checks.x86_64-linux.trix-base-shell

      - name: Run source quality check
        run: nix build .#checks.x86_64-linux.source-quality
